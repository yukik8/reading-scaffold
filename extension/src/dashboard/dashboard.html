<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>reading-scaffold</title>
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <main>
      <header>
        <span class="ring" aria-hidden="true"></span>
        <h1>reading-scaffold</h1>
        <span id="ver" class="ver"></span>
      </header>

      <!-- 帯: 自立度と段位。リングが左端(0)に着いたら卒業=黒帯 -->
      <section class="obi-sec" aria-label="帯">
        <div class="obi-head">
          <span class="eyebrow">帯</span>
          <span id="theta-label" class="theta-read">—</span>
        </div>
        <div class="rank-line">
          <span id="belt" class="belt" title="帯"></span>
          <span class="indep"><b id="indep-pct">—</b><span class="indep-cap">自立度</span></span>
        </div>
        <div class="obi-track" aria-hidden="true"><span id="obi-ring" class="obi-ring"></span></div>
        <div class="obi-ends" aria-hidden="true"><span>0</span><span>8</span></div>
        <p class="note">補助はセッションの成否に応じて自動で漸減します。</p>
        <p id="week-line" class="week-line"></p>
      </section>

      <!-- 自立の推移: θ履歴から導く上昇曲線(集中力の成長) -->
      <section aria-label="自立の推移">
        <span class="eyebrow">自立の推移</span>
        <div id="growth-wrap" class="growth-wrap">
          <div class="growth-y" aria-hidden="true">
            <span>100%</span><span>50%</span><span>0%</span>
          </div>
          <div class="growth-main">
            <svg id="growth" viewBox="0 0 600 160" preserveAspectRatio="none" role="img"
                 aria-label="自立度の推移グラフ"></svg>
            <div id="growth-x" class="growth-x" aria-hidden="true"></div>
          </div>
        </div>
        <p id="growth-empty" class="note" hidden>まだ推移はありません。</p>
      </section>

      <section aria-label="週次推移">
        <span class="eyebrow">補助なし読書時間・週</span>
        <div id="chart"></div>
        <p id="chart-empty" class="note" hidden>まだ記録がありません。</p>
      </section>

      <section aria-label="書架">
        <span class="eyebrow">書架</span>
        <ul id="library" class="rows"></ul>
        <p id="library-empty" class="note" hidden>まだ読んだものがありません。</p>
      </section>

      <section aria-label="クイズ">
        <span class="eyebrow">クイズ</span>
        <ul id="quizzes" class="rows"></ul>
        <p id="quizzes-empty" class="note" hidden>まだクイズは出ていません。</p>
      </section>

      <section aria-label="累計">
        <span class="eyebrow">累計</span>
        <dl id="totals" class="ledger"></dl>
      </section>

      <section aria-label="データ">
        <span class="eyebrow">データ</span>
        <p class="note">
          すべてこの端末のブラウザ内に保存されています。読んだページ・クイズ・生ログが
          サーバへ送られることはありません。
        </p>
        <div class="actions">
          <button id="export" type="button">JSONでエクスポート</button>
        </div>
        <details class="override">
          <summary>開発用</summary>
          <label class="override-label" for="theta">θを手動で上書き</label>
          <input id="theta" type="range" min="0" max="8" step="0.1" value="8" aria-label="補助量θ" />
          <div class="actions">
            <button id="seed-demo" type="button" hidden>玄人デモデータを投入</button>
          </div>
        </details>
        <div class="danger">
          <p class="danger-note">元に戻せない操作</p>
          <button id="wipe" type="button">データを全部消す</button>
        </div>
      </section>
    </main>
    <script type="module" src="dashboard.js"></script>
  </body>
</html>
